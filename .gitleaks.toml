title = "Libella gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = """
Intentional FAKE secrets in lab fixtures: labs/vulnrepo (seeded for the
code-audit scanner tests) and labs/tlslab/certs (generated self-signed lab
keys, gitignored, regenerated at startup). Lab-only, obviously fake,
documented in each lab's ground_truth.json. No real credential is present.
benchmarks/check_target_credentials_ui.py holds a fixture sentinel that the
check asserts never surfaces anywhere; it authenticates only to its own
loopback fixture.
"""
paths = [
  "labs/vulnrepo/app/creds.py",
  "labs/vulnrepo/app/signing.py",
  "labs/tlslab/certs/",
  "benchmarks/check_target_credentials_ui.py",
  # a hand-written JWT for the PDF/HTML injection test: header/payload are the
  # literal string above it and the signature is "signature_for_audit2_test_only"
  "tests/audit2/test_report_pdf_injection.py",
  # pinned upstream commit ids for the standards catalogs (40 hex chars, flagged
  # as a generic key); they are public commit hashes, not credentials
  "scripts/import_standards.py",
]