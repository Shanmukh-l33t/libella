name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install scanner toolchain (code/supply-chain tests)
        run: |
          pip install semgrep
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/trivy /usr/local/bin/gitleaks
      - name: Install browser (rendered-crawl tests)
        run: python -m playwright install --with-deps chromium
      - name: Test environment readiness (critical groups collected, Chromium launches)
        run: python scripts/check_test_env.py
      - name: Lint
        run: ruff check src/ tests/ benchmarks/
      - name: Unit tests
        run: python -m pytest tests/ -q
      # The confinement tests need root (ip/nft/setpriv); the step above runs them
      # unprivileged, where they skip, so the boundary would never be exercised in CI.
      # Run them again as root and fail if they skipped instead of proving anything.
      - name: Network confinement proven as root (no silent skips)
        run: |
          set -euo pipefail            # a failing pytest must fail the step, not the tee
          PY=$(command -v python)
          sudo -E "$PY" -c "import pytest" || { echo "::error::the venv python cannot import pytest"; exit 1; }
          sudo -E "$PY" -m pytest tests/test_netns_confinement.py -q -rs > /tmp/netns.log 2>&1 \
            || { cat /tmp/netns.log; echo "::error::confinement tests failed"; exit 1; }
          cat /tmp/netns.log
          if grep -qE '^SKIPPED' /tmp/netns.log; then
            echo "::error::confinement tests skipped; the boundary was not exercised"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/netns.log || { echo "::error::no passing count: nothing was proven"; exit 1; }
      - name: Integration benchmark (PairLab twins, real execution)
        run: |
          pip install flask requests
          python labs/pairlab/app.py &  # defaults to vuln:8801
          LAB_MODE=hardened LAB_PORT=8802 python labs/pairlab/app.py &
          sleep 3
          python labs/pairlab/verify_ground_truth.py
          python benchmarks/run_pairlab.py --mode both --data-dir /tmp/bench --out /tmp/bench/results.json
          python - <<'EOF'
          import json
          rs = json.load(open("/tmp/bench/results.json"))
          v = next(r for r in rs if r["mode"] == "vuln")
          h = next(r for r in rs if r["mode"] == "hardened")
          assert v["detected"] == 16, f"vuln detection regression: {v['detected']}/16"
          assert v["false_positives"] == 0
          assert h["confirmed"] == 0, f"hardened false positives: {h['confirmed']}"
          assert v["chain"]["ok"] and h["chain"]["ok"]
          print("benchmark gate PASS: 16/16 validated, 0 FP, chains intact")
          EOF

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip install -e .
          pip freeze --exclude-editable > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt