[project]
name = "libella"
version = "0.1.0"
description = "Autonomous penetration-testing workbench. Evidence-first, scope-enforced, multi-agent."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "flask>=3",
       "playwright>=1.40", "pypdf>=4"]  # flask: labs; playwright: browser crawl; pypdf: report tests

[project.scripts]
libella = "libella.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libella"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, version-stable rule set (ruff >=0.17 expanded defaults).
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E402"]  # sys.path bootstrap before imports is intentional
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"  # same-basename test files in different dirs